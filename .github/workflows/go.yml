name: Go

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ExifTool 13.55 (CI temp dir, not repo paths)
        run: |
          set -euo pipefail
          VER=13.55
          SUM=5c9d422ad128fab728aacc5cc0aa77095d14cde74931389dd961d3d720e6b316
          URL="https://github.com/exiftool/exiftool/archive/refs/tags/${VER}.tar.gz"
          curl -fsSL -o "/tmp/exiftool-${VER}.tar.gz" "${URL}"
          echo "${SUM}  /tmp/exiftool-${VER}.tar.gz" | sha256sum -c -
          tar -xzf "/tmp/exiftool-${VER}.tar.gz" -C /tmp
          mv "/tmp/exiftool-${VER}" "/tmp/exiftool-go-exiftool-${VER}"
          test -x "/tmp/exiftool-go-exiftool-${VER}/exiftool"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: oldstable

      - name: Build
        run: go build -v ./...

      - name: Test (Coverage)
        env:
          EXIFTOOL_GO_EXIFTOOL: /tmp/exiftool-go-exiftool-13.55/exiftool
        run: go test -tags "integration,e2e" -v ./... -coverprofile=coverage.out -count=1

      - name: Upload Coverage (Codecov)
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release for $TAG_NAME already exists; skipping."
            exit 0
          fi
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes
