name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ExifTool 13.55 (CI temp dir, not repo paths)
        run: |
          set -euo pipefail
          VER=13.55
          SUM=5f4c81d34ad406538c2871ad72dbfceb5d9b412b2f16cbbeb4d712d270846667
          curl -fsSL -o /tmp/Image-ExifTool-${VER}.tar.gz "https://exiftool.org/Image-ExifTool-${VER}.tar.gz"
          echo "${SUM}  /tmp/Image-ExifTool-${VER}.tar.gz" | sha256sum -c -
          tar -xzf "/tmp/Image-ExifTool-${VER}.tar.gz" -C /tmp
          mv "/tmp/Image-ExifTool-${VER}" "/tmp/exiftool-go-exiftool-${VER}"
          test -x "/tmp/exiftool-go-exiftool-${VER}/exiftool"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: oldstable

      - name: Build
        run: go build -v ./...

      - name: Test
        env:
          EXIFTOOL_GO_EXIFTOOL: /tmp/exiftool-go-exiftool-13.55/exiftool
        run: go test -v ./... -timeout 45m
